<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素横版场景 · 原型 v2</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#eef4ff;color:#2f4364;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:17px;font-weight:600;margin:0 0 3px;letter-spacing:.3px}
  .sub{font-size:12.5px;color:#8494ab;margin:0 0 18px}

  #band{
    position:relative;width:100%;height:216px;overflow:hidden;border-radius:12px;
    background:#7cb8e6;
    box-shadow:0 1px 0 rgba(47,67,100,.06),0 10px 30px -18px rgba(47,67,100,.55);
    isolation:isolate;
  }
  #game{display:block;image-rendering:pixelated;image-rendering:crisp-edges}

  #scan{
    position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.16;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.5) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  body.no-scan #scan{display:none}

  .hud{
    position:absolute;left:12px;top:9px;z-index:3;pointer-events:none;
    display:flex;align-items:center;gap:7px;
    padding:4px 9px;border-radius:3px;
    background:rgba(12,20,38,.52);
    font:600 11.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:1.1px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.55);
  }
  .hud .dot{width:5px;height:5px;background:#6ee7a0;box-shadow:0 0 0 2px rgba(110,231,160,.22)}
  .hud .sep{opacity:.38}
  .hud .act{font-weight:400;color:#cfe0f5}

  .bossbar{
    position:absolute;right:14px;top:10px;z-index:3;width:190px;
    opacity:0;transform:translateY(-6px);
    transition:opacity .35s,transform .45s;pointer-events:none;
  }
  .bossbar.on{opacity:1;transform:none}
  .bossbar .nm{
    font:600 10px/1 ui-monospace,monospace;letter-spacing:1.4px;
    color:#ffd9d9;text-shadow:0 1px 0 rgba(0,0,0,.7);margin-bottom:4px;text-align:right;
  }
  .bossbar .track{height:6px;background:rgba(12,8,16,.68);border:1px solid rgba(255,255,255,.22)}
  .bossbar .fill{height:100%;width:74%;background:linear-gradient(#ff6b5e,#b3201c);box-shadow:0 0 6px rgba(255,90,70,.7)}

  .bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center}
  .bar button{
    appearance:none;border:1px solid #ccd8ea;background:#fff;color:#3d5273;
    font:500 12px/1 -apple-system,"Microsoft YaHei",sans-serif;
    padding:7px 11px;border-radius:6px;cursor:pointer;transition:.16s;letter-spacing:.2px;
  }
  .bar button:hover{border-color:#9db4d4;background:#f7fbff;transform:translateY(-1px)}
  .bar button.on{background:#2f4364;border-color:#2f4364;color:#fff;box-shadow:0 2px 8px -3px rgba(47,67,100,.7)}
  .bar .grow{flex:1}
  .bar .toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:#7d8ba3;user-select:none;cursor:pointer}

  .note{
    margin-top:16px;padding:12px 14px;border-radius:8px;
    background:#fff;border:1px solid #e2eaf6;font-size:12.5px;color:#66748c;line-height:1.75;
  }
  .note b{color:#3d5273;font-weight:600}
  body.clean{display:flex;align-items:center;justify-content:center;min-height:0}
  body.clean .shell{padding:0;max-width:none}
  body.clean h1, body.clean .sub, body.clean .bar, body.clean .note{display:none}
  body.clean #band{border-radius:0;box-shadow:none}
</style>

<body>
<div class="shell">
  <h1>像素横版场景 · v2</h1>
  <p class="sub">画布按屏宽自适应，3 倍整数放大。角色为 PixelLab 生成 + 程序化姿态/特效，七套动作随场景切换。</p>

  <div id="band">
    <canvas id="game"></canvas>
    <div id="scan"></div>
    <div class="hud"><span class="dot"></span><span class="nm" id="hudName">雾隐谷</span><span class="sep">/</span><span class="act" id="hudAct">赶路中</span></div>
    <div class="bossbar" id="bossbar">
      <div class="nm">赤瞳魔猿 · 九阶</div>
      <div class="track"><div class="fill"></div></div>
    </div>
  </div>

  <div class="bar">
    <button data-scene="wild" class="on">旷野</button>
    <button data-scene="cave">秘境</button>
    <button data-scene="cultivate">闭关</button>
    <button data-scene="boss">世界Boss</button>
    <button data-scene="shop">百宝阁</button>
    <button data-scene="alchemy">丹房</button>
    <button data-scene="bag">储物戒</button>
    <span class="grow"></span>
    <label class="toggle"><input type="checkbox" id="autoChk"> 自动巡演</label>
    <label class="toggle"><input type="checkbox" id="scanChk" checked> 扫描线</label>
  </div>

  <div class="note">
    <b>怎么看</b>：小人固定在左侧 28% 处原地跑，背景向左滚 —— 横版游戏的标准做法。切换场景时速度是缓动的：闭关会慢慢刹住，Boss 会猛提速冲出去。
  </div>
</div>

<script>
(function(){
"use strict";

/* =====================================================================
   0 · 画布与工具
   ===================================================================== */
const band = document.getElementById('band');
const cv   = document.getElementById('game');
const ctx  = cv.getContext('2d', { alpha: false });

const LH = 72;
const SCALE = 3;
let   LW = 480;

const GY = 58;
const HERO_AT = 0.28;

function fit(){
  const w = band.clientWidth || 800;
  LW = Math.max(140, Math.round(w / SCALE));
  cv.width = LW; cv.height = LH;
  cv.style.width = (LW * SCALE) + 'px';
  cv.style.height = (LH * SCALE) + 'px';
  ctx.imageSmoothingEnabled = false;
}

function px(g, x, y, w, h, c){
  g.fillStyle = c;
  g.fillRect(x | 0, y | 0, w | 0, h | 0);
}

function line(g, x0, y0, x1, y1, c, w){
  x0 = Math.round(x0); y0 = Math.round(y0);
  x1 = Math.round(x1); y1 = Math.round(y1);
  g.fillStyle = c;
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0, o = (w >> 1);
  const steps = dx + dy + 2;
  for (let i = 0; i < steps; i++){
    g.fillRect(x - o, y - o, w, w);
    if (x === x1 && y === y1) break;
    const e2 = err * 2;
    if (e2 > -dy){ err -= dy; x += sx; }
    if (e2 <  dx){ err += dx; y += sy; }
  }
}

function rnd32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function ridge(n, seed, oct, sharp){
  const r = rnd32(seed);
  const comps = [];
  for (let i = 0; i < oct; i++)
    comps.push({ f: 1 + i * 2, a: 1 / (1 + i * 1.6), p: r() * 6.283 });
  const raw = new Float32Array(n);
  let mn = 1e9, mx = -1e9;
  for (let x = 0; x < n; x++){
    let v = 0;
    for (let i = 0; i < comps.length; i++){
      const c = comps[i];
      v += c.a * Math.sin(6.283 * c.f * x / n + c.p);
    }
    raw[x] = v; if (v < mn) mn = v; if (v > mx) mx = v;
  }
  const sp = (mx - mn) || 1, out = new Float32Array(n);
  for (let x = 0; x < n; x++) out[x] = Math.pow((raw[x] - mn) / sp, sharp);
  return out;
}

/* =====================================================================
   1 · 场景
   ===================================================================== */
const H_BASE = {

  skin:'#f2c8a0', hair:'#2b2b36', sash:'#cf4032', boot:'#3a3244', blade:'#e8eef5'
};

const SCENES = {

    sky:['#5fb2e4','#84c9ef','#aedff6','#d8effb'],

    far:'#7ba5cb', far2:'#9dc0dc', far3:'#bcd7e8',
    mid:'#4f7f5f', mid2:'#3a6048',
    near:'#2f5a3e', near2:'#24452f',
    ground:'#8a6a48', ground2:'#6b5036', ground3:'#a8845c',

    near:'#161f33', near2:'#0f1626',
    ground:'#262b3e', ground2:'#181c2b', ground3:'#3a4160',
    glow:'#5ff0c8',
    dim:0.74,
    hero:{ robe:'#c8dbdd', robe2:'#8ba4b4', robe3:'#6a8296', skin:'#e8bb92', hair:'#1f2230', sash:'#e0705a', boot:'#2a3040', blade:'#cfe6f0' }
  },
  cultivate: {
    name:'洞府 · 云台', act:'闭关入定 1 时 12 分', kind:'cloud', pose:'float', pace:0,
    sky:['#6f9ccb','#93bcd9','#b6d4e8','#d3e5f1'],
    cloud:'#ffffff',
    far:'#6f92b4', far2:'#8aa8c6', far3:'#a9c4d8',
    mid:'#9ab5cb', mid2:'#7e9cb6',
    near:'#8ea9be', near2:'#6f8ca4',
    ground:'#bfd2df', ground2:'#a0b6c6', ground3:'#dde9f0',
    hero:{ robe:'#f8f4e6', robe2:'#d6d0b8', robe3:'#b0aa92', skin:'#f2c8a0', hair:'#2b2b36', sash:'#d8a44a', boot:'#3a3244', blade:'#e8eef5' }
  },
  boss: {
    name:'血战 · 断魂崖', act:'挑战世界 Boss', kind:'boss', pose:'slash', pace:1.9,
    sky:['#3a1e2b','#5c2b36','#84393f','#ab5247'],
    far:'#3e2632', far2:'#4e303a', far3:'#2e1c26',
    mid:'#332428', mid2:'#231820',
    near:'#261a20', near2:'#181014',
    ground:'#3a2828', ground2:'#261a1c', ground3:'#523c36',
    dim:0.80,
    hero:{ robe:'#ece6d8', robe2:'#b6ae9e', robe3:'#8e8878', skin:'#e8bb92', hair:'#241f28', sash:'#e8543c', boot:'#2e2632', blade:'#ffd9a0' }
  },
  shop: {
    name:'坊市 · 百宝阁', act:'看货中', kind:'in-shop', pose:'look', pace:.16,
    wall:'#5c3d28', wall2:'#6d4a31', beam:'#422b1d',
    shelf:'#7a5030', shelf2:'#3f2919',
    item:['#cdbb92','#8fa88c','#b8865c','#6f8a9c','#d4c8a8','#a8746a'],
    lantern:'#e8573c', lantern2:'#ffb066',
    floor:'#5a3c26', floor2:'#3e2818',
    hero: H_BASE
  },
  alchemy: {
    name:'丹房 · 青炉', act:'开炉炼丹', kind:'in-alchemy', pose:'alchemy', pace:0,
    wall:'#38343e', wall2:'#45414c', beam:'#2a2630',
    shelf:'#54463a', shelf2:'#2e2620',
    item:['#8fa88c','#c9a45e','#6f8a9c','#cdbb92','#d4c8a8'],
    lantern:'#5fd8b0', lantern2:'#a8ffe0',
    floor:'#413c38', floor2:'#2b2725',
    hero:{ robe:'#e8e4d8', robe2:'#b8b2a4', robe3:'#948e80', skin:'#e8bb92', hair:'#26232e', sash:'#6bbfa0', boot:'#2e2832', blade:'#dfe7ef' }
  },
  bag: {
    name:'静室 · 储物戒', act:'清点 38 件', kind:'in-bag', pose:'cast', pace:0,
    wall:'#c3d1d8', wall2:'#d3dfe4', beam:'#a6b7c0',
    shelf:'#a3b8c1', shelf2:'#8aa0aa',
    item:['#cdbb92','#8fd8c0','#c9b06e','#a8b8c8','#e0d8c4'],
    lantern:'#f2e8ca', lantern2:'#fffaf0',
    floor:'#adbec6', floor2:'#90a2ac',
    hero:{ robe:'#f4f1e4', robe2:'#cdc8b2', robe3:'#a8a38c', skin:'#f2c8a0', hair:'#2a2a34', sash:'#7fc9b0', boot:'#3a3244', blade:'#dfe7ef' }
  }
};

/* =====================================================================
   2 · 背景
   ===================================================================== */
let TW = 320;
const TILES = {};

function tile(fn){
  const c = document.createElement('canvas');
  c.width = TW; c.height = LH;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  fn(g);
  return c;
}

function drawClouds(g, S, seed, yBase){
  const r = rnd32(seed);
  const n = 3 + Math.floor(r() * 2);
  for (let i = 0; i < n; i++){
    const x = Math.floor(r() * TW);
    const y = yBase - Math.floor(r() * 7);
    const w = 14 + Math.floor(r() * 22);
    for (const ox of [x, x - TW]){
      px(g, ox + 3, y, w - 6, 3, S.cloud);
      px(g, ox, y + 2, w, 2, S.cloud);
      px(g, ox + 6, y - 1, Math.max(2, w - 14), 2, S.cloud);
    }
  }
}

function drawFar(g, S, seed, baseY, amp, col){
  const h = ridge(TW, seed, 4, 1.55);
  for (let x = 0; x < TW; x++){
    const y = Math.round(baseY - h[x] * amp);
    px(g, x, y, 1, Math.max(0, GY + 4 - y), col);
  }
  g.fillStyle = 'rgba(255,255,255,.22)';
  for (let x = 0; x < TW; x++){
    const y = Math.round(baseY - h[x] * amp);
    const y2 = Math.round(baseY - h[(x + 1) % TW] * amp);
    if (y2 < y){ g.fillRect(x, y, 1, 1); g.fillRect(x + 1, y + 1, 1, 1); }
  }
}

function drawBamboo(g, S, seed){
  const r = rnd32(seed);
  const base = GY + 1;
  const clusters = 2 + Math.floor(r() * 3);

  for (let c = 0; c < clusters; c++){
    const cx = Math.floor(r() * TW);
    const stalkN = 3 + Math.floor(r() * 3);
    const H0 = 24 + Math.floor(r() * 12);

    for (let s = 0; s < stalkN; s++){
      const x = cx + (s - stalkN / 2) * 3 + Math.floor(r() * 2);
      const hgt = H0 + Math.floor(r() * 7);
      const top = base - hgt;
      const lean = (r() - .5) * 2;

      for (const ox of [x, x - TW]){
        for (let k = 0; k < hgt; k++){
          const yy = top + k;
          const xx = Math.round(ox + lean * k / hgt);
          px(g, xx, yy, 1, 1, k % 5 === 0 ? S.mid2 : S.mid);
        }
        const dir = s % 2 ? 1 : -1;
        for (let l = 0; l < 5; l++){
          const ly = top + 3 + l * 7;
          const lx = Math.round(ox + lean * (ly - top) / hgt);
          line(g, lx, ly, lx + dir * (2 + l), ly - 2, S.mid, 1);
          line(g, lx, ly, lx - dir * (1 + l), ly - 1, S.mid2, 1);
        }
      }
    }
  }
}

function drawTree(g, S, seed, count){
  const r = rnd32(seed);
  const base = GY + 1;
  for (let i = 0; i < count; i++){
    const x = Math.floor(r() * TW);
    const th = 16 + Math.floor(r() * 10);
    const top = base - th - 9;
    const cr = 7 + Math.floor(r() * 3);
    for (const ox of [x, x - TW]){
      px(g, ox, base - th, 2, th, S.mid2);
      px(g, ox + 2, base - th, 1, th, S.mid2);
      // 簇状树冠：撒点成团，比纯圆更蓬松
      for (let k = 0; k < 30; k++){
        const a = r() * 6.283, rad = Math.sqrt(r());
        const dx = Math.round(Math.cos(a) * rad * cr * 1.35);
        const dy = Math.round(Math.sin(a) * rad * cr * 0.95);
        px(g, ox + 1 + dx, top + dy, 2, 2, S.mid);
      }
      // 底部阴影 + 顶部受光
      for (let k = 0; k < 10; k++){
        const dx = Math.round((r() - .5) * cr * 2);
        px(g, ox + 1 + dx, top + cr - Math.floor(r() * 3), 2, 1, S.mid2);
      }
      for (let k = 0; k < 8; k++){
        const dx = Math.round((r() - .5) * cr * 1.7);
        px(g, ox + 1 + dx, top - cr + 1 + Math.floor(r() * 3), 1, 1, S.near || S.mid);
      }
    }
  }
}

function drawGrass(g, S, seed){
  const r = rnd32(seed);
  const base = GY + 2;
  for (let i = 0; i < 46; i++){
    const x = Math.floor(r() * TW);
    const h = 2 + Math.floor(r() * 4);
    const d = r() > .5 ? 1 : -1;
    for (const ox of [x, x - TW]){
      line(g, ox, base, ox + d, base - h, S.near, 1);
      if (r() > .55) line(g, ox + 1, base, ox, base - h + 1, S.near2, 1);
    }
  }
  for (let i = 0; i < 5; i++){
    const x = Math.floor(r() * TW), y = base - 1;
    for (const ox of [x, x - TW]){
      px(g, ox, y - 1, 4, 2, S.near2);
      px(g, ox, y - 2, 3, 1, S.near);
    }
  }
}

function drawGround(g, S, seed){
  const r = rnd32(seed);
  const y0 = GY + 2;
  px(g, 0, y0, TW, LH - y0, S.ground);
  px(g, 0, y0, TW, 1, S.ground3);
  px(g, 0, y0 + 1, TW, 1, S.ground2);
  for (let i = 0; i < 70; i++){
    const x = Math.floor(r() * TW);
    const y = y0 + 2 + Math.floor(r() * (LH - y0 - 2));
    px(g, x, y, r() > .8 ? 2 : 1, 1, r() > .5 ? S.ground2 : S.ground3);
  }
  px(g, 0, LH - 3, TW, 3, S.ground2);
}

function drawCave(g, S, seed){
  const r = rnd32(seed);
  px(g, 0, 0, TW, LH, S.far3);
  for (let i = 0; i < 44; i++){
    const x = Math.floor(r() * TW);
    const len = 4 + Math.floor(r() * 13);
    for (const ox of [x, x - TW]){
      for (let k = 0; k < len; k++){
        const w = Math.max(1, Math.round((1 - k / len) * 3));
        px(g, ox + ((3 - w) >> 1), k, w, 1, S.far);
      }
    }
  }
  const h = ridge(TW, seed + 13, 3, 1.3);
  for (let x = 0; x < TW; x++){
    const y = Math.round(GY - 2 - h[x] * 5);
    px(g, x, y, 1, Math.max(0, GY + 4 - y), S.far2);
  }
}

function drawCaveRock(g, S, seed){
  const r = rnd32(seed);
  const base = GY + 2;
  for (let i = 0; i < 9; i++){
    const x = Math.floor(r() * TW);
    const hh = 2 + Math.floor(r() * 4);
    for (const ox of [x, x - TW]){
      px(g, ox, base - hh, 3 + Math.floor(r() * 3), hh, S.near2);
      px(g, ox, base - hh, 2, 1, S.near);
    }
  }
  for (let i = 0; i < 70; i++){
    const x = Math.floor(r() * TW);
    const y = base - 2 - Math.floor(r() * 9);
    g.globalAlpha = .16; px(g, x - 1, y - 1, 3, 3, S.glow); g.globalAlpha = 1;
    px(g, x, y, 1 + (r() > .7 ? 1 : 0), 1, S.glow);
    if (r() > .55) px(g, x, y - 1, 1, 1, S.glow);
    if (r() > .82) px(g, x, y - 2, 1, 1, S.glow);
  }
}

function drawCloudSea(g, S, seed, solid){
  const h = ridge(TW, seed, 4, .8);
  const h2 = ridge(TW, seed + 31, 3, 1.1);
  for (let x = 0; x < TW; x++){
    const y = Math.round(GY - (solid ? 0 : 2) - h[x] * (solid ? 5 : 7) - h2[x] * 3);
    px(g, x, y, 1, LH - y, solid ? '#e9f2fa' : 'rgba(255,255,255,.72)');
    px(g, x, y, 1, 1, '#ffffff');
    // 云顶厚度：往下两行用更实的白，云海才有体积
    if (y + 1 < LH) px(g, x, y + 1, 1, 1, solid ? '#dfeaf6' : 'rgba(255,255,255,.5)');
    if (!solid && h[x] > .55 && y + 2 < LH) px(g, x, y + 2, 1, 1, 'rgba(255,255,255,.34)');
  }
}

function drawCultFar(g, S, seed){
  const h = ridge(TW, seed, 3, 1.5);
  for (let x = 0; x < TW; x++){
    const y = Math.round(GY - 17 - h[x] * 13);
    px(g, x, y, 1, Math.max(0, GY + 4 - y), S.far);
  }
  const r = rnd32(seed + 3);
  for (let i = 0; i < 9; i++){
    const x = Math.floor(r() * TW);
    const y = GY - 3 - Math.floor(r() * 9);
    const w = 10 + Math.floor(r() * 20);
    for (const ox of [x, x - TW]){
      px(g, ox, y, w, 2, 'rgba(255,255,255,.6)');
      px(g, ox + 2, y - 1, Math.max(2, w - 5), 1, 'rgba(255,255,255,.4)');
    }
  }
}

function drawInWall(g, S, seed){
  const r = rnd32(seed);
  px(g, 0, 0, TW, LH, S.wall);
  for (let x = 0; x < TW; x += 5) px(g, x, 0, 1, GY + 2, S.wall2);
  px(g, 0, 0, TW, 2, S.beam);
  px(g, 0, 13, TW, 2, S.beam);
  px(g, 0, 25, TW, 2, S.beam);
  for (let i = 0; i < 30; i++)
    px(g, Math.floor(r() * TW), Math.floor(r() * (GY + 2)), 1, 1, S.wall2);
}

/* ---- 百宝阁：多宝格（塞满） ---- */
function drawShopShelf(g, S, seed){
  const r = rnd32(seed);
  const base = GY + 2;
  const gap = Math.floor(TW / 3);

  for (let s = 0; s < 3; s++){
    const sx = s * gap + 8;
    const sw = Math.min(74, gap - 12);

    px(g, sx, 4, sw, base - 4, S.shelf2);
    px(g, sx, 4, sw, 2, S.shelf);
    px(g, sx, 4, 1, base - 4, S.shelf);
    px(g, sx + sw - 1, 4, 1, base - 4, S.shelf);

    for (let row = 0; row < 3; row++){
      const ry = 7 + row * 8;
      const cells = 2 + Math.floor(r() * 2);
      const cw = Math.floor(sw / cells);
      for (let c = 0; c < cells; c++){
        const cx0 = sx + c * cw + 1;
        const cwid = cw - 2;
        px(g, cx0, ry, cwid, 6, S.shelf2);

        // 一层里密排器物：高矮胖瘦混着来
        let ix = cx0 + 1;
        let lastH = 4;
        while (ix < cx0 + cwid - 1){
          let w = 2 + Math.floor(r() * 3);
          if (ix + w > cx0 + cwid - 1) w = cx0 + cwid - 1 - ix;
          if (w < 1) break;
          const hh = Math.max(2, Math.min(6, lastH + Math.floor(r() * 5) - 2));
          lastH = hh;
          const col = S.item[Math.floor(r() * S.item.length)];
          // 瓶/罐：上窄下宽，带口沿
          for (let k = 0; k < hh; k++){
            const t2 = k / Math.max(1, hh - 1);
            const ww = Math.max(1, Math.round(w - t2 * 1.6));
            px(g, ix + ((w - ww) >> 1), ry + 6 - 1 - k, ww, 1, col);
          }
          if (w >= 3) px(g, ix + ((w - 1) >> 1), ry + 6 - hh, 2, 1, 'rgba(255,255,255,.55)');
          px(g, ix, ry + 5, 1, 1, 'rgba(0,0,0,.18)');
          if (r() > .7) px(g, ix + ((w - 1) >> 1), ry + 4 - hh, 1, 1, 'rgba(255,255,255,.7)');
          ix += w + (r() > .7 ? 1 : 0);
        }
        px(g, cx0 - 1, ry, 1, 7, S.shelf);
        px(g, cx0 - 1, ry + 6, cwid + 1, 1, S.shelf);
      }
    }
  }

  for (let i = 0; i < 3; i++){
    const lx = Math.floor(TW / 6) + i * Math.floor(TW / 3);
    px(g, lx, 0, 1, 4, S.shelf2);
    px(g, lx - 2, 3, 5, 4, S.lantern);
    px(g, lx - 1, 4, 3, 2, S.lantern2);
    px(g, lx - 2, 7, 5, 1, S.lantern);
    g.globalAlpha = .14;
    px(g, lx - 5, 2, 11, 8, S.lantern2);
    g.globalAlpha = 1;
  }
}

/* ---- 丹房：药柜（大抽屉）+ 药瓶架 ---- */
function drawAlchemyCabinet(g, S, seed){
  const r = rnd32(seed);
  const base = GY + 2;
  const sw = Math.min(92, Math.floor(TW * 0.34));
  const xs = [8, Math.floor(TW * 0.60)];

  for (let s = 0; s < 2; s++){
    const sx = xs[s];
    px(g, sx, 2, sw, base - 2, S.shelf2);
    px(g, sx, 2, sw, 2, S.shelf);
    px(g, sx, 2, 1, base - 2, S.shelf);
    px(g, sx + sw - 1, 2, 1, base - 2, S.shelf);

    const cols = 6, rows = 5;
    const dw = Math.floor((sw - 4) / cols), dh = 5;
    for (let row = 0; row < rows; row++){
      for (let c = 0; c < cols; c++){
        const dx = sx + 2 + c * dw, dy = 4 + row * 6;
        px(g, dx, dy, dw - 1, dh, S.shelf);
        px(g, dx, dy, dw - 1, 1, 'rgba(255,255,255,.16)');
        px(g, dx, dy + dh - 1, dw - 1, 1, S.shelf2);
        // 拉手
        px(g, dx + (dw >> 1) - 1, dy + 2, 2, 1, S.shelf2);
        // 药名小标签
        if (r() > .45) px(g, dx + 2, dy + 1, dw - 5, 1, S.item[Math.floor(r() * S.item.length)]);
      }
    }
    // 柜顶药瓶排
    for (let i = 0; i < 8; i++){
      const bx = sx + 2 + i * Math.floor(sw / 8);
      const hh = 2 + Math.floor(r() * 2);
      px(g, bx, 2 - hh, 2, hh, S.item[Math.floor(r() * S.item.length)]);
    }
  }

  for (let i = 0; i < 2; i++){
    const lx = Math.floor(TW / 4) + i * Math.floor(TW / 2);
    px(g, lx, 0, 1, 5, S.shelf2);
    px(g, lx - 1, 4, 3, 3, S.lantern);
    px(g, lx, 5, 1, 1, S.lantern2);
    g.globalAlpha = .14;
    px(g, lx - 4, 2, 9, 8, S.lantern2);
    g.globalAlpha = 1;
  }
}

/* ---- 静室：素墙 + 墙裙 + 格窗 + 大挂轴 ---- */
function drawQuietWall(g, S, seed){
  const r = rnd32(seed);
  px(g, 0, 0, TW, LH, S.wall);

  // 墙面粉化斑驳
  for (let i = 0; i < 90; i++)
    px(g, Math.floor(r() * TW), Math.floor(r() * (GY - 6)), 1 + Math.floor(r() * 2), 1, S.wall2);

  // 顶部梁
  px(g, 0, 0, TW, 2, S.beam);

  // 墙裙（下半截木板）
  const skirt = GY - 8;
  px(g, 0, skirt, TW, GY + 2 - skirt, S.shelf2);
  for (let x = 0; x < TW; x += 13) px(g, x, skirt, 1, GY + 2 - skirt, S.beam);
  px(g, 0, skirt, TW, 1, S.shelf);

  // 格窗：两扇，固定位置
  for (let i = 0; i < 2; i++){
    const wx = Math.round(TW * (0.30 + i * 0.42));
    const wy = 5, ww = 20, wh = 14;
    px(g, wx - 1, wy - 1, ww + 2, wh + 2, S.beam);
    px(g, wx, wy, ww, wh, '#eaf2f5');
    // 窗棂
    for (let x = wx + 4; x < wx + ww; x += 5) px(g, x, wy, 1, wh, S.beam);
    for (let y = wy + 4; y < wy + wh; y += 5) px(g, wx, y, ww, 1, S.beam);
    // 透光
    g.globalAlpha = .22;
    px(g, wx - 6, wy, ww + 14, wh + 6, '#ffffff');
    g.globalAlpha = 1;
  }

  // 大挂轴
  const ax = Math.round(TW * 0.62);
  const aw = 14, ah = 18, ay = 4;
  px(g, ax - 2, ay - 1, aw + 4, 1, S.beam);
  px(g, ax - 1, ay, aw + 2, ah + 3, S.shelf2);
  px(g, ax, ay + 1, aw, ah, '#f5efe2');
  for (let k = 0; k < 4; k++)
    px(g, ax + 2 + (k % 2), ay + 4 + k * 4, aw - 4 - k, 1, '#8a9298');
  px(g, ax - 2, ay + ah + 2, aw + 4, 1, S.beam);
  px(g, ax + 1, ay + ah + 4, aw - 2, 1, S.shelf);
}

function drawInFloor(g, S, seed){
  const r = rnd32(seed);
  const y0 = GY + 2;
  px(g, 0, y0, TW, LH - y0, S.floor);
  for (let y = y0 + 2; y < LH; y += 3) px(g, 0, y, TW, 1, S.floor2);
  for (let i = 0; i < 30; i++)
    px(g, Math.floor(r() * TW), y0 + 1 + Math.floor(r() * (LH - y0 - 1)), 2, 1, 'rgba(255,240,210,.2)');
}

function buildTiles(){
  TW = LW;
  for (const key in SCENES){
    const S = SCENES[key];
    const sd = key.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
    const t = {};

    if (S.kind === 'out'){
      t.sky   = tile(g => drawClouds(g, S, sd + 2, Math.round(LH * 0.16)));
      t.far   = tile(g => drawFar(g, S, sd, GY - 14, 17, S.far));
      t.far2  = tile(g => drawFar(g, S, sd + 17, GY - 4, 12, S.far2));
      t.mid   = tile(g => { drawTree(g, S, sd + 5, 3); drawBamboo(g, S, sd + 9); });
      t.near  = tile(g => drawGrass(g, S, sd + 13));
      t.ground= tile(g => drawGround(g, S, sd + 21));
    } else if (S.kind === 'cave' || S.kind === 'boss'){
      t.sky   = tile(g => null);
      t.far   = tile(g => drawCave(g, S, sd));
      t.far2  = tile(g => drawFar(g, S, sd + 17, GY - 5, 12, S.far2));
      t.mid   = tile(g => drawBamboo(g, S, sd + 9));
      t.near  = tile(g => drawCaveRock(g, S, sd + 13));
      t.ground= tile(g => drawGround(g, S, sd + 21));
    } else if (S.kind === 'cloud'){
      t.sky   = tile(g => drawClouds(g, S, sd + 2, Math.round(LH * 0.14)));
      t.far   = tile(g => drawCultFar(g, S, sd));
      t.far2  = tile(g => drawCultFar(g, S, sd + 6));
      t.mid   = tile(g => drawCloudSea(g, S, sd + 10, false));
      t.near  = tile(g => null);
      t.ground= tile(g => drawCloudSea(g, S, sd + 14, true));
    } else if (S.kind === 'in-shop'){
      t.sky   = tile(g => null);
      t.far   = tile(g => drawInWall(g, S, sd));
      t.mid   = tile(g => drawShopShelf(g, S, sd + 5));
      t.near  = tile(g => null);
      t.ground= tile(g => drawInFloor(g, S, sd + 21));
    } else if (S.kind === 'in-alchemy'){
      t.sky   = tile(g => null);
      t.far   = tile(g => drawInWall(g, S, sd));
      t.mid   = tile(g => drawAlchemyCabinet(g, S, sd + 5));
      t.near  = tile(g => null);
      t.ground= tile(g => drawInFloor(g, S, sd + 21));
    } else {
      t.sky   = tile(g => null);
      t.far   = tile(g => drawQuietWall(g, S, sd));
      t.mid   = tile(g => drawQuietWall(g, S, sd + 5));
      t.near  = tile(g => null);
      t.ground= tile(g => drawInFloor(g, S, sd + 21));
    }
    TILES[key] = t;
  }
}

/* =====================================================================
   3 · 小人
   ===================================================================== */
const ROBE_W = [5, 6, 6, 5, 5, 6, 6, 7, 8, 8];

function drawHead(g, cx, yb, C, closed, pose, t){
  cx = Math.round(cx);
  const SK = C.skin, HR = C.hair;

  // 脸：5 宽 6 高
  const fw = [3, 5, 5, 5, 5, 4];
  for (let i = 0; i < 6; i++)
    px(g, cx - (fw[i] >> 1), yb - 6 + i, fw[i], 1, SK);

  // 头发只在顶部，不向两侧加宽
  px(g, cx - 2, yb - 8, 5, 2, HR);
  px(g, cx - 2, yb - 6, 3, 1, HR);
  px(g, cx - 3, yb - 5, 1, 3, HR);
  // 发髻 + 簪
  px(g, cx - 1, yb - 10, 3, 2, HR);
  px(g, cx + 2, yb - 9, 2, 1, C.sash);

  if (closed){
    px(g, cx + 1, yb - 4, 2, 1, HR);
  } else if (pose === 'search' || pose === 'pace'){
    const look = Math.sin(t * 1.6) > 0 ? 1 : 0;
    px(g, cx + 1 + look, yb - 4, 1, 1, HR);
  } else {
    px(g, cx + 2, yb - 4, 1, 1, HR);
  }
}

/* =====================================================================
   小人 v7 —— 手绘像块 + 逐行扫描四肢 + 离屏描边
   局部坐标：中轴 x=16，脚底 y=30，身高 28px
   ===================================================================== */
const HB_W = 38, HB_H = 34, HB_CX = 17, HB_GY = 30;
const HERO_BUF = document.createElement('canvas');
HERO_BUF.width = HB_W; HERO_BUF.height = HB_H;
const HB = HERO_BUF.getContext('2d');

function hpx(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(x|0,y|0,w,h); }

function hstamp(g, rows, x0, y0){
  for (let y=0;y<rows.length;y++){
    const ln = rows[y];
    for (let x=0;x<ln.length;x++){
      const ch = ln[x];
      if (ch === '.') continue;
      const c = HPAL[ch];
      if (c) hpx(g, x0+x, y0+y, 1, 1, c);
    }
  }
}

/* 当前帧取材的调色板（每帧由 drawHero 写入 C 的映射） */
let HPAL = {};

/* ---- 头 7 行 × 6 列 ---- */
const H_HEAD = ['..hh..','.hHhh.','hhsss.','hsses.','.ssS..'];
const H_HEAD_SHUT = ['..hh..','.hHhh.','hhsss.','hssSs.','.ssS..'];

/* ---- 上身 12 行 × 10 列（y10..y21） ---- */
const H_BODY = [
  '....rssr....',
  '..rrrrrrrr..',
  '..rRrrrrrD..',
  '..rRrrrrrD..',
  '..rRrDrrrD..',
  '..rRrDrrrD..',
  '..bbbbbbbb..',
  '..BBBBBBBB..',
  '.rrrrDrrrDD.',
  '.rrrrDrrrDD.',
  '.rrrrDrrrDD.',
];
/* ---- 下摆 7 行 × 11 列（y22..y28） ---- */
const H_HEM = [
  '..rrrrrrrDD..',
  '.rrrrrrrrrDD.',
  '.rrrrrrrrrDDD',
  'rrrrrrrrrrDDD',
  'DrrrrrrrrrDDD',
  'DDDDDDDDDDDD.',
];
const H_HEM_RUN = [
  [ '..rrrrrrrDD..','.rrrrrrrrrDD.','.rrrrrrrrrDDD','DrrrrrrrrrDDD','DrrrrrrrrDDD.','DDDDDDDDD....' ],
  [ '..rrrrrrrDD..','.rrrrrrrrrDD.','.rrrrrrrrrDDD','.rrrrrrrrrDDD','DrrrrrrrrDDD.','DDDDDDDDDDDD.' ],
  [ '..rrrrrrrDD..','.rrrrrrrrrDD.','.rrrrrrrrrDDD','rrrrrrrrrrDDD','DrrrrrrrrrDDD','DDDDDDDDDDDD.' ],
  [ '..rrrrrrrDD..','.rrrrrrrrrDD.','.rrrrrrrrrDDD','.rrrrrrrrrDDD','DrrrrrrrrDDD.','DDDDDDDDDDDD.' ],
];
/* ---- 盘坐的袍摆 ---- */
const H_HEM_SIT = ['..rrrrrr..','.rrrrrrrr.','.rrrrrrrr.','rrrrrrrrrr','DDDDDDDDDD'];

function hSleeve(g, sx, sy, ex, ey, hx, hy, col, edge){
  const n1 = Math.max(1, Math.abs(ey-sy));
  for (let i=0;i<=n1;i++){
    const t=i/n1;
    const x=Math.round(sx+(ex-sx)*t), y=sy+Math.round((ey-sy)*t);
    hpx(g, x, y, 3, 1, col);
    hpx(g, x, y, 1, 1, edge);
  }
  const n2 = Math.max(1, Math.abs(hy-ey));
  for (let i=0;i<=n2;i++){
    const t=i/n2;
    const x=Math.round(ex+(hx-ex)*t), y=Math.round(ey+(hy-ey)*t);
    const w = t > .40 ? 4 : 3;
    hpx(g, x, y, w, 1, col);
    hpx(g, x, y, 1, 1, edge);
    hpx(g, x+w-1, y, 1, 1, edge);
  }
  hpx(g, hx+2, hy, 2, 2, HPAL.s);
}

function hBoot(g, cx, y, back){
  const c = back ? HPAL.K : HPAL.k;
  hpx(g, cx-1, y,   3, 1, c);
  hpx(g, cx-2, y+1, 3, 1, c);
}

/* 只在缓冲区内描边（外轮廓按亮度压暗，受光侧保留更多） */
function hOutline(g){
  const img = g.getImageData(0,0,HB_W,HB_H), d = img.data;
  const src = new Uint8ClampedArray(d);
  const A=(x,y)=>(x<0||y<0||x>=HB_W||y>=HB_H)?0:src[((y*HB_W)+x)*4+3];
  for(let y=0;y<HB_H;y++)for(let x=0;x<HB_W;x++){
    const i=((y*HB_W)+x)*4;
    if(!src[i+3])continue;
    if(A(x-1,y)&&A(x+1,y)&&A(x,y-1)&&A(x,y+1))continue;
    const lit = !A(x,y-1) || !A(x-1,y);
    const f = lit ? .74 : .52;
    d[i]=src[i]*f; d[i+1]=src[i+1]*f; d[i+2]=src[i+2]*(f+.04);
  }
  g.putImageData(img,0,0);
}

function drawHero(g, cx, gy, pose, t, C){
  // 调色板：优先用场景配色，缺失的用默认
  HPAL = {
    h: C.hair   || '#4a4058', H: C.hair2 || '#6b5f80',
    s: C.skin   || '#f7dab4', S: C.skin2 || '#ddb089', e: '#2b2119',
    r: C.robe   || '#eef4fd', R: C.robe2 || '#cdddef',
    D: C.robe3  || '#a8bfd9', K: '#8aa2c0',
    b: C.sash   || '#d4483f', B: C.sash2 || '#a02c2a',
    k: C.boot   || '#3c3a4b', g: '#c9a45e', w: C.blade || '#e4edf7',
  };
  const G = HB;
  G.clearRect(0,0,HB_W,HB_H);
  const CX = HB_CX, SHO = 11, GY = HB_GY;

  const bodyAt = (top, runK) => {
    hstamp(G, H_BODY, CX-5, top);
    if (runK === undefined) hstamp(G, H_HEM, CX-5, top+11);
    else hstamp(G, H_HEM_RUN[runK % 4], CX-5, top+11);
  };

  if (pose === 'sit' || pose === 'alchemy'){
    const top = GY - 22;              // y8：头在 y3..7
    hstamp(G, H_BODY, CX-5, top);      // 身 y8..y18
    hstamp(G, H_HEM_SIT, CX-5, top+11);// 摆 y19..y23
    // 盘起的膝
    hpx(G, CX-6, top+11, 3, 2, HPAL.D);
    hpx(G, CX+4, top+11, 3, 2, HPAL.D);
    // 结印（交叠的双手）
    hpx(G, CX-1, top+8, 4, 1, HPAL.s);
    hpx(G, CX-1, top+9, 3, 1, HPAL.S);
    hstamp(G, H_HEAD_SHUT, CX-3, top-5);
    hOutline(G);
    g.drawImage(HERO_BUF, Math.round(cx)-CX, Math.round(gy)-GY);
    return;
  }

  if (pose === 'run'){
    // 4 帧循环由 t 驱动
    const k = Math.floor(t * 9) % 4;
    const p = [
      { fB:[ 6,0], bB:[-4,0], aE:[ 3,3], aH:[ 5,6], bE:[-3,3], bH:[-5,6], bob:0 },
      { fB:[ 2,0], bB:[-2,0], aE:[ 2,3], aH:[ 3,6], bE:[-1,3], bH:[-2,6], bob:1 },
      { fB:[-4,0], bB:[ 6,0], aE:[-2,3], aH:[-5,6], bE:[ 3,3], bH:[ 5,6], bob:0 },
      { fB:[-2,0], bB:[ 2,0], aE:[-1,3], aH:[-2,6], bE:[ 2,3], bH:[ 3,6], bob:1 },
    ][k];
    const sho = SHO - p.bob;

    hSleeve(G, CX-4, sho+2, CX-4+p.bE[0], sho+2+p.bE[1], CX-4+p.bH[0], sho+2+p.bH[1], HPAL.R, HPAL.D);
    // 飘带
    for (let i=0;i<5;i++){
      const x = CX-5-i;
      const y = 20 - Math.round(i*0.5 + Math.sin(t*7 - i*0.55)*i*0.3);
      hpx(G, x, y, 1, 1, i<4 ? HPAL.b : HPAL.B);
    }
    hBoot(G, CX + p.bB[0] - 1, GY-2, true);
    bodyAt(sho, k);
    hstamp(G, H_HEAD, CX-3, 6 - p.bob);
    hBoot(G, CX + p.fB[0], GY-2, false);
    hSleeve(G, CX+3, sho+2, CX+3+p.aE[0], sho+2+p.aE[1], CX+3+p.aH[0], sho+2+p.aH[1], HPAL.r, HPAL.D);

    hOutline(G);
    g.drawImage(HERO_BUF, Math.round(cx)-CX, Math.round(gy)-GY);
    return;
  }

  if (pose === 'fight'){
    const sw = Math.sin(t * 9);
    const sho = SHO;
    hSleeve(G, CX-4, sho+2, CX-6, sho+5, CX-6, sho+9, HPAL.R, HPAL.D);
    hBoot(G, CX-7, GY-2, true);
    bodyAt(sho, 0);
    hstamp(G, H_HEAD, CX-3, 6);
    hBoot(G, CX+7, GY-2, false);
    const ex = CX+4, ey = sho+3;
    const hx = CX+7, hy = sho + Math.round(sw*2);
    hSleeve(G, CX+3, sho+2, ex, ey, hx, hy, HPAL.r, HPAL.D);
    const bx = hx+2, by = hy-1;
    for (let i=0;i<13;i++) hpx(G, bx + Math.round(i*0.45), by - i, 1, 1, HPAL.w);
    hpx(G, bx, by+1, 3, 2, HPAL.B);
    hpx(G, bx+1, by+1, 1, 1, HPAL.g);

    hOutline(G);
    g.drawImage(HERO_BUF, Math.round(cx)-CX, Math.round(gy)-GY);
    return;
  }

  // 站 / 看货 / 翻找
  const b = Math.sin(t*2.2) > .65 ? 1 : 0;
  const sho = SHO - b;
  hSleeve(G, CX-4, sho+2, CX-4, sho+6, CX-4, sho+9, HPAL.R, HPAL.D);
  hBoot(G, CX-3, GY-2, true);
  bodyAt(sho);
  hstamp(G, H_HEAD, CX-3, 6-b);
  hBoot(G, CX+3, GY-2, false);
  hSleeve(G, CX+3, sho+2, CX+4, sho+6, CX+4, sho+9, HPAL.r, HPAL.D);

  hOutline(G);
  g.drawImage(HERO_BUF, Math.round(cx)-CX, Math.round(gy)-GY);
}

/* ---- 丹炉（固定物件，不随背景滚） ---- */
function drawCauldron(g, x, gy, t){
  x = Math.round(x); const y = Math.round(gy);
  const DK = '#28302d', MD = '#3f4c46', LT = '#5c6b61';

  px(g, x - 6, y - 2, 2, 3, DK);
  px(g, x - 1, y - 2, 2, 3, DK);
  px(g, x + 4, y - 2, 2, 3, DK);

  for (let r = 0; r < 13; r++){
    const w = Math.round(8 + 8 * Math.sin(Math.PI * (r + 1) / 14));
    px(g, x - (w >> 1), y - 3 - r, w, 1, r < 3 ? LT : (r > 8 ? DK : MD));
  }
  px(g, x - 8, y - 9, 17, 1, DK);
  px(g, x - 6, y - 17, 13, 2, DK);
  px(g, x - 5, y - 18, 11, 1, LT);

  const f = .5 + Math.sin(t * 9) * .5;
  g.globalAlpha = .45 + f * .55;
  px(g, x - 4, y - 14, 9, 1, '#ffb060');
  px(g, x - 2, y - 15, 5, 1, '#ffd9a0');
  g.globalAlpha = 1;

  for (let i = 0; i < 7; i++){
    const sy = y - 16 - i * 2.4;
    const sx = x + Math.sin(t * 1.8 + i * .7) * 2.2;
    g.globalAlpha = Math.max(0, .45 - i * .055);
    px(g, sx, sy, 1 + (i % 2), 1, '#cfe0dc');
  }
  g.globalAlpha = 1;
}

/* ---- 戒环光环 ---- */
function drawRingGlow(g, x, gy, t){
  for (let i = 0; i < 3; i++){
    const ph = ((t * .5 + i / 3) % 1);
    const rx = 5 + ph * 17, ry = 1.5 + ph * 4;
    g.globalAlpha = (1 - ph) * .5;
    for (let k = 0; k < 44; k++){
      const a = k / 44 * 6.283;
      px(g, Math.round(x + Math.cos(a) * rx), Math.round(gy + Math.sin(a) * ry), 1, 1, '#7fe0c4');
    }
  }
  g.globalAlpha = 1;
  for (let i = 0; i < 4; i++){
    const a = t * .6 + i * 1.57;
    px(g, Math.round(x + Math.cos(a) * 14), Math.round(gy - 13 + Math.sin(a * 1.3) * 3), 2, 2, '#d8ccaa');
  }
}

/* =====================================================================
   4 · Boss
   ===================================================================== */
function drawBoss(g, x, gy, t){
  const bob = Math.round(Math.sin(t * 2.4));
  const y = gy + bob;

  // 背后血光：让剪影从暗底里跳出来
  for (let r = 26; r > 0; r -= 5){
    g.globalAlpha = .07;
    g.beginPath();
    g.arc(x, y - 16, r, 0, 6.283);
    g.fillStyle = '#b03040';
    g.fill();
  }
  g.globalAlpha = 1;
  const D = '#2a1824', D2 = '#3f2637', D3 = '#6b4260';
  const EYE = '#ff5a44';

  for (let r = 0; r < 21; r++){
    const w = Math.round(24 * Math.sin(Math.PI * (r + 3) / 24) + 5);
    px(g, x - (w >> 1), y - 21 + r, w, 1, r < 2 ? D3 : D);
  }
  px(g, x - 12, y - 16, 24, 6, D2);
  px(g, x - 7, y - 29, 14, 9, D);
  px(g, x - 6, y - 29, 12, 1, D3);
  line(g, x - 6, y - 28, x - 11, y - 35, D3, 2);
  line(g, x + 6, y - 28, x + 11, y - 35, D3, 2);

  const glow = .55 + Math.sin(t * 3.6) * .45;
  g.globalAlpha = glow;
  px(g, x - 5, y - 26, 3, 2, EYE);
  px(g, x + 3, y - 26, 3, 2, EYE);
  g.globalAlpha = 1;

  px(g, x - 5, y - 22, 10, 2, '#0b0508');
  for (let i = 0; i < 4; i++) px(g, x - 4 + i * 3, y - 22, 1, 2, '#bfae9c');

  const sw = Math.sin(t * 3) * 3;
  line(g, x - 11, y - 14, x - 19, y - 4 + sw, D2, 5);
  line(g, x + 11, y - 14, x + 19, y - 4 - sw, D2, 5);
  for (let i = 0; i < 3; i++)
    line(g, x - 20, y - 5 + sw, x - 23, y - 7 + i * 2 + sw, D3, 1);
}

const ACT_IMG = {};
for (const k in SPR_B64){
  ACT_IMG[k] = SPR_B64[k].map(function (b){
    const im = new Image();
    im.src = 'data:image/png;base64,' + b;
    return im;
  });
}
const ACT_FPS = { idle:5, walk:10, float:8, alchemy:7, slash:12, look:5, cast:8 };
const SPR_W = 48, SPR_H = 48, SPR_FOOT = 44, SPR_CX = 24;

function drawHeroSprite(g, cx, gy, act, t, dim){
  const arr = ACT_IMG[act] || ACT_IMG.idle;
  if (!arr) return;
  const fps = ACT_FPS[act] || 8;
  const img = arr[Math.floor(t * fps) % arr.length];
  if (!img || !img.complete || !img.naturalWidth) return;

  const ix = Math.round(cx) - SPR_CX;
  const iy = Math.round(gy) - SPR_FOOT;

  // 落地投影
  g.fillStyle = 'rgba(0,0,0,.22)';
  g.fillRect(Math.round(cx) - 6, Math.round(gy), 12, 1);
  g.fillRect(Math.round(cx) - 4, Math.round(gy) + 1, 8, 1);

  if (dim && dim < 1 && g.filter !== undefined){
    g.filter = 'brightness(' + dim + ')';
    g.drawImage(img, ix, iy);
    g.filter = 'none';
  } else {
    g.drawImage(img, ix, iy);
  }
}

/* =====================================================================
   5 · 主循环
   ===================================================================== */
const state = { scene:'wild', speed:1.6, world:0, t:0, fade:0, bossIn:0 };
const BASE = 1.6;

function setScene(key){
  if (!SCENES[key] || key === state.scene) return;
  state.scene = key;
  state.fade = 1;
  state.bossIn = 0;
  paintHUD(key);
}

function drawLayer(tl, off){
  if (!tl) return;
  const w = tl.width;
  let x = -Math.floor(((off % w) + w) % w);
  while (x < LW){ ctx.drawImage(tl, x, 0); x += w; }
}

function render(){
  const S = SCENES[state.scene];
  const T = TILES[state.scene];
  if (!T) return;

  state.t += 1 / 60;
  state.world += state.speed;
  const tt = state.t, w = state.world;

  const bands = S.sky;
  if (bands) for (let i = 0; i < bands.length; i++){
    const n = bands.length;
    // 渐变压在天空区（0~GY），最后一段留给地面下方的兜底色
    const skyLine = GY;
    const y0 = i < n - 1 ? Math.round(i * skyLine / (n - 1)) : skyLine;
    const y1 = i < n - 1 ? Math.round((i + 1) * skyLine / (n - 1)) : LH;
    px(ctx, 0, y0, LW, y1 - y0, bands[i]);
    if (i > 0){
      for (let x = i & 1; x < LW; x += 2){
        px(ctx, x, y0, 1, 1, bands[i - 1]);
        px(ctx, x + 1, y0 - 1, 1, 1, bands[i]);
      }
    }
  }

  const indoor = S.kind === 'in-shop' || S.kind === 'in-alchemy' || S.kind === 'in-bag';

  if (!indoor){
    drawLayer(T.sky,  w * 0.04);
    drawLayer(T.far,  w * 0.10);
    drawLayer(T.far2, w * 0.20);
    drawLayer(T.mid,  w * 0.45);
    drawLayer(T.near, w * 0.75);

    if (state.scene === 'boss'){
      state.bossIn = Math.min(1, state.bossIn + .014);
      const e = 1 - Math.pow(1 - state.bossIn, 3);
      drawBoss(ctx, LW * 0.70 - (1 - e) * 46, GY + 3, tt);
    }

    drawLayer(T.ground, w * 1.0);
    drawHeroSprite(ctx, LW * HERO_AT, GY + 4, S.pose, tt, S.dim);
  } else {
    drawLayer(T.far,    w * 0.16);
    drawLayer(T.mid,    w * 0.50);
    drawLayer(T.ground, w * 1.0);
    if (state.scene === 'bag')     drawRingGlow(ctx, LW * 0.60, GY + 8, tt);
    drawHeroSprite(ctx, LW * HERO_AT, GY + 4, S.pose, tt, S.dim);
  }

  if (state.fade > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + (state.fade * .5) + ')';
    ctx.fillRect(0, 0, LW, LH);
    state.fade = Math.max(0, state.fade - .1);
  }
}

function tick(){
  const S = SCENES[state.scene];
  const target = BASE * S.pace;
  const k = target > state.speed ? .05 : .03;
  state.speed += (target - state.speed) * k;
  if (Math.abs(target - state.speed) < .006) state.speed = target;
  render();
  requestAnimationFrame(tick);
}

/* =====================================================================
   6 · UI
   ===================================================================== */
function paintHUD(key){
  const S = SCENES[key];
  document.getElementById('hudName').textContent = S.name;
  document.getElementById('hudAct').textContent  = S.act;
  document.getElementById('bossbar').classList.toggle('on', key === 'boss');
  document.querySelectorAll('.bar [data-scene]').forEach(b =>
    b.classList.toggle('on', b.dataset.scene === key));
}

document.querySelectorAll('.bar [data-scene]').forEach(b =>
  b.addEventListener('click', () => setScene(b.dataset.scene)));

document.getElementById('scanChk').addEventListener('change', e =>
  document.body.classList.toggle('no-scan', !e.target.checked));

let autoT = null;
document.getElementById('autoChk').addEventListener('change', e => {
  clearInterval(autoT);
  if (!e.target.checked) return;
  const order = ['wild','cave','cultivate','boss','shop','alchemy','bag'];
  let i = order.indexOf(state.scene);
  autoT = setInterval(() => { i = (i + 1) % order.length; setScene(order[i]); }, 4200);
});

window.addEventListener('keydown', e => {
  const m = { '1':'wild','2':'cave','3':'cultivate','4':'boss','5':'shop','6':'alchemy','7':'bag' };
  if (m[e.key]) setScene(m[e.key]);
});

const q = new URLSearchParams(location.search);
if (q.get('scene') && SCENES[q.get('scene')]) state.scene = q.get('scene');

fit();
buildTiles();
paintHUD(state.scene);

if (q.get('freeze') === '1'){
  setTimeout(() => { state.speed = 0; state.t = 1.7; }, 800);
}
if (q.get('scan') === '0') document.body.classList.add('no-scan');
if (q.get('clean') === '1'){
  document.body.classList.add('clean');
  document.body.style.padding = '0';
  document.body.style.background = 'transparent';
}
if (state.scene === 'boss') state.bossIn = 1;

let rzT = null;
window.addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => { fit(); buildTiles(); }, 180);
});

tick();
window.__setScene = setScene;
})();
</script>
