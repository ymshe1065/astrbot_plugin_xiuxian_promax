<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f0e8da">
<title>修仙聊天室</title>
<link rel="stylesheet" href="/static/app.css?v=__ASSET_VER__">
</head>
<body>

<!-- ============ 登录 ============ -->
<div id="login" class="screen">
  <div class="login-card">
    <div class="login-mark">☯</div>
    <h1>修 仙 聊 天 室</h1>
    <p class="sub">聚灵谷 · 同道共聚一室</p>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" data-mode="login" role="tab">登 录</button>
      <button class="auth-tab" data-mode="register" role="tab">注 册</button>
    </div>

    <label for="inUser">道号（账号）</label>
    <input id="inUser" maxlength="16" placeholder="2-16 位，中文 / 字母 / 数字"
           autocomplete="username" autocapitalize="off" spellcheck="false">
    <label for="inPwd">密码</label>
    <input id="inPwd" type="password" maxlength="64" placeholder="至少 6 位"
           autocomplete="current-password">
    <div id="nickField" hidden>
      <label for="inNick">昵称（可选）</label>
      <input id="inNick" maxlength="16" placeholder="留空则与道号相同" autocomplete="nickname">
    </div>
    <button id="btnAuth" class="btn-primary">登 入</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" hidden>

  <!-- 顶部：播报横幅 -->
  <div id="banner" class="banner" hidden>
    <span class="banner-icon">📢</span>
    <div class="banner-text" id="bannerText"></div>
    <button class="banner-close" id="bannerClose" aria-label="关闭">×</button>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">☯</span>
      <span class="brand-text">修仙聊天室</span>
    </div>
    <span class="room-tag" id="onlineTag">在线 1</span>
    <div class="topbar-right">
      <span class="conn" id="connState">未连接</span>
      <button class="me-btn" id="btnMe" title="账号设置">
        <span class="me-dot" id="meDot">我</span>
        <span class="me-nick" id="meNick">我</span>
      </button>
      <button class="icon-btn only-desktop" id="btnTogglePanel" title="收起/展开看板">⟨</button>
    </div>
  </header>

  <main class="main">
    <!-- 聊天区 -->
    <section class="chat-pane" id="chatPane">
      <div class="msgs" id="msgs"></div>

      <div class="quick-options" id="quickOptions" hidden></div>

      <div class="composer">
        <button class="composer-btn" id="btnQuick" title="快捷指令">☰</button>
        <textarea id="inMsg" rows="1" maxlength="2000"
                  placeholder="发消息或 /指令…"></textarea>
        <button class="composer-btn send" id="btnSend" title="发送">➤</button>
      </div>
    </section>

    <!-- 看板 -->
    <aside class="panel-pane" id="panelPane">
      <div class="panel-tabs" role="tablist">
        <button class="panel-tab active" data-tab="status" role="tab">状态</button>
        <button class="panel-tab" data-tab="bag" role="tab">储物戒</button>
        <button class="panel-tab" data-tab="cmds" role="tab">指令</button>
      </div>
      <div class="panel-body">
        <div class="panel-view active" data-view="status" id="viewStatus"></div>
        <div class="panel-view" data-view="bag" id="viewBag"></div>
        <div class="panel-view" data-view="cmds" id="viewCmds"></div>
      </div>
    </aside>
  </main>

  <!-- 移动端底部导航 -->
  <nav class="mobile-nav">
    <button class="mnav active" data-nav="chat"><span>💬</span>聊天</button>
    <button class="mnav" data-nav="status"><span>☯</span>状态</button>
    <button class="mnav" data-nav="bag"><span>🎒</span>储物戒</button>
    <button class="mnav" data-nav="cmds"><span>⚡</span>指令</button>
  </nav>

  <div class="drawer-mask" id="drawerMask" hidden></div>
</div>

<!-- ============ 参数输入弹层 ============ -->
<div class="sheet-mask" id="sheetMask" hidden>
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <span id="sheetTitle">输入参数</span>
      <button class="sheet-close" id="sheetClose">×</button>
    </div>
    <div class="sheet-hint" id="sheetHint"></div>
    <div class="sheet-acts" id="sheetActs" hidden></div>
    <input id="sheetInput" autocomplete="off" enterkeyhint="done">
    <div class="sheet-foot">
      <button class="btn-ghost" id="sheetExample" hidden>用示例</button>
      <button class="btn-primary" id="sheetOk">发 送</button>
    </div>
  </div>
</div>

<!-- ============ 账号设置 ============ -->
<div class="sheet-mask" id="accMask" hidden>
  <div class="sheet acc-sheet">
    <div class="sheet-head">
      <span>账号设置</span>
      <button class="sheet-close" id="accClose">×</button>
    </div>
    <div class="acc-id">
      <span class="me-dot big" id="accDot">我</span>
      <div class="acc-id-text">
        <div class="acc-nick" id="accNickShow">我</div>
        <div class="acc-user" id="accUser">—</div>
      </div>
    </div>
    <label for="accNick">昵称</label>
    <input id="accNick" maxlength="16" placeholder="群里显示的名字">
    <button class="btn-primary" id="accSaveNick">保存昵称</button>

    <div class="acc-divider"></div>

    <label for="accOld">原密码</label>
    <input id="accOld" type="password" maxlength="64" autocomplete="current-password">
    <label for="accNew">新密码</label>
    <input id="accNew" type="password" maxlength="64" autocomplete="new-password">
    <button class="btn-ghost" id="accSavePwd">修改密码</button>
    <button class="btn-ghost danger" id="accLogout">退出登录</button>
    <div class="err" id="accErr"></div>
  </div>
</div>

<!-- ============ 图片全屏查看 ============ -->
<div class="viewer" id="viewer" hidden>
  <img id="viewerImg" alt="">
  <button class="viewer-close" id="viewerClose" aria-label="关闭">×</button>
  <div class="viewer-tip">双指缩放 / 双击放大 / 拖动查看</div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/static/app.js?v=__ASSET_VER__"></script>
</body>
</html>
