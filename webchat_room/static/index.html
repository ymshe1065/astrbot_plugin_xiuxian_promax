<!DOCTYPE html>
<html lang="zh-CN" data-theme="fish">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" id="metaTheme" content="#eef4ff">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23a33b2a'/%3E%3C/svg%3E">
<title>修仙聊天室</title>
<script>
/* 首屏定主题：必须在 CSS 生效前跑，否则会闪一下默认皮肤
 * 默认皮肤 = 大肥鱼（fish）；用户手动切过才用记录里的值。 */
(function () {
  try {
    var t = localStorage.getItem("xiuxian_theme_v2");
    if (t !== "fish" && t !== "xian") t = "fish";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/static/app.css?v=__ASSET_VER__">
</head>
<body>

<!-- ============ 登录 ============ -->
<div id="login" class="screen">
  <div class="login-card">
    <div class="login-mark" id="loginMark">☯</div>
    <h1>修 仙 聊 天 室</h1>
    <p class="sub" id="loginSub">聚灵谷 · 同道共聚一室</p>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" data-mode="login" role="tab">登 录</button>
      <button class="auth-tab" data-mode="register" role="tab">注 册</button>
    </div>

    <label for="inUser">道号（账号）</label>
    <input id="inUser" maxlength="16" placeholder="2-16 位，中文 / 字母 / 数字"
           autocomplete="username" autocapitalize="off" spellcheck="false">
    <label for="inPwd">密码</label>
    <input id="inPwd" type="password" maxlength="64" placeholder="至少 6 位"
           autocomplete="current-password">
    <div id="nickField" hidden>
      <label for="inNick">昵称（可选）</label>
      <input id="inNick" maxlength="16" placeholder="留空则与道号相同" autocomplete="nickname">
    </div>
    <button id="btnAuth" class="btn-primary">登 入</button>
    <div class="err" id="loginErr"></div>
    <button class="theme-toggle" id="loginTheme" type="button">换个皮肤 · 大肥鱼</button>
    <p class="credit">形象 © 上善无形 / ZipZipPipe · CC BY-NC-SA 4.0</p>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" hidden>

  <!-- 顶部：播报横幅 -->
  <div id="banner" class="banner" hidden>
    <span class="banner-icon">📢</span>
    <div class="banner-text" id="bannerText"></div>
    <button class="banner-close" id="bannerClose" aria-label="关闭">×</button>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" id="brandMark">☯</span>
      <span class="brand-text">修仙聊天室</span>
    </div>
    <button class="room-tag" id="onlineTag" type="button" title="查看在线名单">在线 1</button>
    <div class="topbar-right">
      <span class="conn" id="connState">未连接</span>
      <button class="icon-btn" id="btnTheme" title="切换主题" aria-label="切换主题">🐋</button>
      <button class="me-btn" id="btnMe" title="账号设置">
        <span class="me-dot" id="meDot">我</span>
        <span class="me-nick" id="meNick">我</span>
      </button>
      <button class="icon-btn only-desktop" id="btnTogglePanel" title="收起/展开看板">⟨</button>
    </div>
  </header>

  <main class="main">
    <!-- 聊天区 -->
    <section class="chat-pane" id="chatPane">
      <div class="msgs" id="msgs"></div>

      <div class="quick-options" id="quickOptions" hidden></div>

      <div class="composer">
        <button class="composer-btn" id="btnQuick" title="快捷指令">☰</button>
        <textarea id="inMsg" rows="1" maxlength="2000"
                  placeholder="发消息或 /指令…"></textarea>
        <button class="composer-btn send" id="btnSend" title="发送">➤</button>
      </div>
    </section>

    <!-- 看板 -->
    <aside class="panel-pane" id="panelPane">
      <div class="panel-tabs" role="tablist">
        <button class="panel-tab active" data-tab="status" role="tab">状态</button>
        <button class="panel-tab" data-tab="bag" role="tab">储物戒</button>
        <button class="panel-tab" data-tab="proxy" role="tab">自动代理</button>
        <button class="panel-tab" data-tab="cmds" role="tab">指令</button>
      </div>
      <div class="panel-body">
        <div class="panel-view active" data-view="status" id="viewStatus"></div>
        <div class="panel-view" data-view="bag" id="viewBag"></div>
        <div class="panel-view" data-view="proxy" id="viewProxy"></div>
        <div class="panel-view" data-view="cmds" id="viewCmds"></div>
      </div>
    </aside>
  </main>

  <!-- 移动端底部导航 -->
  <nav class="mobile-nav">
    <button class="mnav active" data-nav="chat"><span>💬</span>聊天</button>
    <button class="mnav" data-nav="status"><span>☯</span>状态</button>
    <button class="mnav" data-nav="bag"><span>🎒</span>储物戒</button>
    <button class="mnav" data-nav="proxy"><span>🤖</span>代理</button>
    <button class="mnav" data-nav="cmds"><span>⚡</span>指令</button>
  </nav>

  <div class="drawer-mask" id="drawerMask" hidden></div>
</div>

<!-- ============ 参数输入弹层 ============ -->
<div class="sheet-mask" id="sheetMask" hidden>
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <span id="sheetTitle">输入参数</span>
      <button class="sheet-close" id="sheetClose">×</button>
    </div>
    <div class="sheet-hint" id="sheetHint"></div>
    <div class="sheet-acts" id="sheetActs" hidden></div>
    <div class="sheet-chosen" id="sheetChosen" hidden></div>
    <div class="sheet-picks" id="sheetPicks" hidden>
      <div class="picks-head">
        <span id="sheetPickLabel">可选内容</span>
        <span class="picks-count" id="sheetPickCount"></span>
      </div>
      <input id="sheetFilter" class="picks-filter" autocomplete="off" placeholder="筛选（输入名称关键字）">
      <div class="picks-list" id="sheetOptList"></div>
      <button class="picks-more" id="sheetMore" hidden>展开全部</button>
    </div>
    <input id="sheetInput" autocomplete="off" enterkeyhint="done">
    <div class="sheet-foot">
      <button class="btn-ghost" id="sheetSkip" hidden>跳过</button>
      <button class="btn-ghost" id="sheetExample" hidden>用示例</button>
      <button class="btn-primary" id="sheetOk">发 送</button>
    </div>
  </div>
</div>

<!-- ============ 账号设置 ============ -->
<div class="sheet-mask" id="accMask" hidden>
  <div class="sheet acc-sheet">
    <div class="sheet-head">
      <span>账号设置</span>
      <button class="sheet-close" id="accClose">×</button>
    </div>
    <div class="acc-id">
      <span class="me-dot big" id="accDot">我</span>
      <div class="acc-id-text">
        <div class="acc-nick" id="accNickShow">我</div>
        <div class="acc-user" id="accUser">—</div>
      </div>
    </div>

    <label>头像</label>
    <div class="avatar-pick" id="avatarPick"></div>
    <input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
    <div class="avatar-tip" id="avatarTip">点选内置头像，或上传一张自己的（自动裁成方形）</div>

    <label for="accNick">昵称</label>
    <input id="accNick" maxlength="16" placeholder="群里显示的名字">
    <button class="btn-primary" id="accSaveNick">保存昵称</button>

    <div class="acc-divider"></div>
    <label>QQ 存档绑定</label>
    <div class="bind-state" id="bindState">读取中…</div>
    <div class="bind-row">
      <input id="bindQq" inputmode="numeric" maxlength="12" placeholder="输入旧存档使用的QQ号" autocomplete="off">
      <button class="btn-primary" id="btnBind" type="button">绑 定</button>
    </div>
    <button class="btn-ghost" id="btnUnbind" type="button" hidden>解除绑定，回到网页存档</button>
    <div class="bind-tip" id="bindTip">绑定后直接用旧 QQ 角色继续玩。</div>

    <div class="acc-divider"></div>
    <label>外观主题</label>
    <div class="theme-pick" id="themePick">
      <button class="theme-opt" data-theme-val="xian" type="button">
        <i class="sw sw-xian"></i><span>宣纸玉简</span>
      </button>
      <button class="theme-opt" data-theme-val="fish" type="button">
        <i class="sw sw-fish"></i><span>大肥鱼</span>
      </button>
    </div>

    <div class="acc-divider"></div>

    <label for="accOld">原密码</label>
    <input id="accOld" type="password" maxlength="64" autocomplete="current-password">
    <label for="accNew">新密码</label>
    <input id="accNew" type="password" maxlength="64" autocomplete="new-password">
    <button class="btn-ghost" id="accSavePwd">修改密码</button>
    <button class="btn-ghost danger" id="accLogout">退出登录</button>
    <div class="err" id="accErr"></div>
  </div>
</div>

<!-- ============ 在线名单 ============ -->
<div class="sheet-mask" id="onlineMask" hidden>
  <div class="sheet online-sheet">
    <div class="sheet-head">
      <span>在线同道 <em class="online-count" id="onlineCount">0</em></span>
      <button class="sheet-close" id="onlineClose">×</button>
    </div>
    <div class="online-list" id="onlineList"></div>
  </div>
</div>

<!-- ============ 图片全屏查看 ============ -->
<div class="viewer" id="viewer" hidden>
  <img id="viewerImg" alt="">
  <button class="viewer-close" id="viewerClose" aria-label="关闭">×</button>
  <div class="viewer-tip">双指缩放 / 双击放大 / 拖动查看</div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/static/app.js?v=__ASSET_VER__"></script>
</body>
</html>
