<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f0e8da">
<title>修仙聊天室</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- ============ 登录 ============ -->
<div id="login" class="screen">
  <div class="login-card">
    <div class="login-mark">☯</div>
    <h1>修 仙 聊 天 室</h1>
    <p class="sub">聚灵谷 · 同道共聚一室</p>
    <label for="inName">道号</label>
    <input id="inName" maxlength="20" placeholder="例如：云无月" autocomplete="nickname">
    <label for="inRoom">洞府房间</label>
    <input id="inRoom" maxlength="30" value="room_main">
    <button id="btnJoin" class="btn-primary">踏 入 仙 途</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" hidden>

  <!-- 顶部：播报横幅 -->
  <div id="banner" class="banner" hidden>
    <span class="banner-icon">📢</span>
    <div class="banner-text" id="bannerText"></div>
    <button class="banner-close" id="bannerClose" aria-label="关闭">×</button>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">☯</span>
      <span class="brand-text">修仙聊天室</span>
    </div>
    <span class="room-tag" id="roomTag"></span>
    <div class="topbar-right">
      <span class="conn" id="connState">未连接</span>
      <button class="icon-btn only-desktop" id="btnTogglePanel" title="收起/展开看板">⟨</button>
    </div>
  </header>

  <main class="main">
    <!-- 聊天区 -->
    <section class="chat-pane" id="chatPane">
      <div class="msgs" id="msgs"></div>

      <div class="quick-options" id="quickOptions" hidden></div>

      <div class="composer">
        <button class="composer-btn" id="btnQuick" title="快捷指令">☰</button>
        <textarea id="inMsg" rows="1" maxlength="2000"
                  placeholder="发消息或 /指令…"></textarea>
        <button class="composer-btn send" id="btnSend" title="发送">➤</button>
      </div>
    </section>

    <!-- 看板 -->
    <aside class="panel-pane" id="panelPane">
      <div class="panel-tabs" role="tablist">
        <button class="panel-tab active" data-tab="status" role="tab">状态</button>
        <button class="panel-tab" data-tab="bag" role="tab">储物戒</button>
        <button class="panel-tab" data-tab="cmds" role="tab">指令</button>
      </div>
      <div class="panel-body">
        <div class="panel-view active" data-view="status" id="viewStatus"></div>
        <div class="panel-view" data-view="bag" id="viewBag"></div>
        <div class="panel-view" data-view="cmds" id="viewCmds"></div>
      </div>
    </aside>
  </main>

  <!-- 移动端底部导航 -->
  <nav class="mobile-nav">
    <button class="mnav active" data-nav="chat"><span>💬</span>聊天</button>
    <button class="mnav" data-nav="status"><span>☯</span>状态</button>
    <button class="mnav" data-nav="bag"><span>🎒</span>储物戒</button>
    <button class="mnav" data-nav="cmds"><span>⚡</span>指令</button>
  </nav>

  <div class="drawer-mask" id="drawerMask" hidden></div>
</div>

<!-- ============ 参数输入弹层 ============ -->
<div class="sheet-mask" id="sheetMask" hidden>
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <span id="sheetTitle">输入参数</span>
      <button class="sheet-close" id="sheetClose">×</button>
    </div>
    <div class="sheet-hint" id="sheetHint"></div>
    <input id="sheetInput" autocomplete="off" enterkeyhint="done">
    <button class="btn-primary" id="sheetOk">发 送</button>
  </div>
</div>

<!-- ============ 图片全屏查看 ============ -->
<div class="viewer" id="viewer" hidden>
  <img id="viewerImg" alt="">
  <button class="viewer-close" id="viewerClose" aria-label="关闭">×</button>
  <div class="viewer-tip">双指缩放 / 双击放大 / 拖动查看</div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
